# .github/workflows/load-test.yml: a performance gate on every pull request
name: Load test
on: [pull_request]
permissions:
  contents: read
  pull-requests: write   # the summary comment
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: usespitfire/spitfire-action@v1
        with:
          url: https://spitfire.example.com
          token: ${{ secrets.SPITFIRE_TOKEN }}
          test: "Shop: log in, browse, add to cart, check out"
          environment: staging
          report: spitfire-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spitfire
          path: |
            spitfire-summary.json
            spitfire-report.html
